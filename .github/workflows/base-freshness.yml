name: base freshness

# A branch cut before another PR merged can carry the *pre-merge* version of a
# file. If the merge is clean, git takes the branch's side — so merging silently
# REVERTS the earlier fix. Nothing warns:
#
#   - `git merge-base --is-ancestor <earlier-fix> HEAD` → true (still in the DAG)
#   - CI → green (no test pins the tree)
#   - the merge → clean (no conflict markers)
#
# That has already cost this org real downtime:
#
#   - rxsoft-qa#803 — rxsoft `main` would not compile (duplicate `UUID_RE`,
#     TS2451). Removed twice, silently reverted by a clean merge from a stale
#     branch, and every dev/QA environment went down.
#   - rxsoft-qa#800 — identity's `/auth/me` `permissionMode` clobbered by a merge.
#   - rxsoft-qa#801 — the seed org-template parent grants, caught by diffing
#     against current main before pushing.
#
# This asserts the PR BRANCH contains the current base tip — the condition
# violated in all three. CI equivalent of GitHub's "Require branches to be up to
# date before merging"; enable either, ideally both.
#
# ⚠️ The PR head MUST be checked out explicitly. `actions/checkout` defaults to
# the synthetic MERGE commit (`refs/pull/N/merge`) on a pull_request event, and
# that commit contains the base tip *by construction* — so the assertion below
# would pass unconditionally and the job would be pure decoration. (Measured on
# a deliberately stale branch: HEAD was `9f8cd2e1 Merge <head> into <base>`,
# i.e. the base tip was its own first parent, and the check still passed.)
#
# Running in ui, rxsoft, identity, seed, conversation, concepts, interop, lims,
# emr (rxsoft-qa#801).

on:
  pull_request:
    branches:
      - '**'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.sha }}
  cancel-in-progress: true

jobs:
  base_is_current:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Branch must contain the current base tip
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git fetch origin "$BASE_REF" --depth=1
          echo "head       = $(git rev-parse HEAD)"
          echo "base tip   = $(git rev-parse "origin/$BASE_REF")"
          echo "merge-base = $(git merge-base HEAD "origin/$BASE_REF" || echo none)"
          if git merge-base --is-ancestor "origin/$BASE_REF" HEAD; then
            echo "Base is current — merging cannot revert a merged fix."
          else
            echo "::error::Branch is behind origin/$BASE_REF. Update it (rebase or merge) before merging."
            echo "A stale base merges cleanly while silently reverting a merged fix — see rxsoft-qa#801 / #803."
            exit 1
          fi
