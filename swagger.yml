info:
  title: EMR API
  description: >-
    Electronic Medical Record: appointments, visits, encounters, dynamic forms,
    and clinical requests
  version: 1.0.0
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    ProxyLoginDto:
      type: object
      properties:
        username:
          type: string
          example: admin
          description: Username
        password:
          type: string
          example: password
          description: Password (min 6 characters)
      required:
        - username
        - password
    ProxyRefreshTokenDto:
      type: object
      properties:
        refreshToken:
          type: string
      required:
        - refreshToken
    AssignPatientTagsDto:
      type: object
      properties:
        tagIds:
          description: Full set of tag ids for the patient (replaces the current set)
          type: array
          items:
            type: string
    CreatePatientDto:
      type: object
      properties:
        patientId:
          type: string
        firstName:
          type: string
        lastName:
          type: string
        otherNames:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        nextOfKinName:
          type: string
        nextOfKinPhone:
          type: string
        nextOfKinRelationship:
          type: string
        identifiers:
          type: array
          items:
            type: string
        maritalStatus:
          type: string
        occupation:
          type: string
        bloodGroup:
          type: string
        genotype:
          type: string
        paymentProviderIds:
          type: array
          items:
            type: string
      required:
        - firstName
        - lastName
    UpdatePatientDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        otherNames:
          type: string
        dateOfBirth:
          type: string
        gender:
          type: string
        phone:
          type: string
        email:
          type: string
        address:
          type: string
        nextOfKinName:
          type: string
        nextOfKinPhone:
          type: string
        nextOfKinRelationship:
          type: string
        identifiers:
          type: array
          items:
            type: string
        maritalStatus:
          type: string
        occupation:
          type: string
        bloodGroup:
          type: string
        genotype:
          type: string
        paymentProviderIds:
          type: array
          items:
            type: string
        isActive:
          type: boolean
    Object:
      type: object
      properties: {}
    CreateTagDto:
      type: object
      properties:
        name:
          type: string
          description: Tag name (unique per organization)
        color:
          type: string
          description: 'Hex color for chips (e.g. #e64980)'
    UpdateTagDto:
      type: object
      properties:
        name:
          type: string
          description: Tag name (unique per organization)
        color:
          type: string
          description: 'Hex color for chips (e.g. #e64980)'
    CreatePaymentProviderDto:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: &ref_16
            - CASH
            - HMO
            - COMPANY
            - PROGRAM
            - OTHER
        description:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
      required:
        - code
        - name
        - type
    UpdatePaymentProviderDto:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        type:
          type: string
          enum: *ref_16
        description:
          type: string
        contactPhone:
          type: string
        contactEmail:
          type: string
        isActive:
          type: boolean
    CreateStaffDto:
      type: object
      properties:
        staffNumber:
          type: string
          description: Auto-generated as STF-xxx if omitted
        firstName:
          type: string
        lastName:
          type: string
        otherNames:
          type: string
        email:
          type: string
        phone:
          type: string
        hireDate:
          type: string
        roleType:
          type: string
          enum: &ref_17
            - Doctor
            - Nurse
            - Technician
            - Therapist
            - Admin
            - Support
            - Specialist
            - Finance
        category:
          type: string
          enum: &ref_18
            - Medical
            - Nursing
            - Allied Health
            - Pharmacy
            - Laboratory
            - Administrative
            - Support
            - Other
        department:
          type: string
        departmentId:
          type: string
          description: EMR department id (departments table)
        identityLocationId:
          type: string
          description: Location id in the identity service
        userId:
          type: string
          description: Linked identity-service user id (login)
        isActive:
          type: boolean
          default: true
        otherDetails:
          type: object
      required:
        - firstName
        - lastName
        - roleType
    UpdateStaffDto:
      type: object
      properties:
        firstName:
          type: string
        lastName:
          type: string
        otherNames:
          type: string
        email:
          type: string
        phone:
          type: string
        hireDate:
          type: string
        roleType:
          type: string
          enum: *ref_17
        category:
          type: string
          enum: *ref_18
        department:
          type: string
        departmentId:
          type: string
          description: EMR department id (departments table)
        identityLocationId:
          type: string
          description: Location id in the identity service
        userId:
          type: string
          description: Linked identity-service user id (login)
        isActive:
          type: boolean
        otherDetails:
          type: object
    CreateDepartmentDto:
      type: object
      properties:
        code:
          type: string
          example: RADIOLOGY
        name:
          type: string
          example: Radiology
        departmentType:
          type: string
          enum: &ref_19
            - OPD
            - INPATIENT
            - EMERGENCY
            - LABORATORY
            - PHARMACY
            - RADIOLOGY
            - MATERNITY
            - SUPPORT
            - OTHER
          default: OPD
        description:
          type: string
        locationId:
          type: string
          description: >-
            Identity location (site) id the department belongs to; defaults to
            the caller’s location
        isActive:
          type: boolean
          default: true
        parentId:
          type: object
          description: Optional parent department id
      required:
        - code
        - name
    UpdateDepartmentDto:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        departmentType:
          type: string
          enum: *ref_19
        description:
          type: string
        locationId:
          type: string
          description: Identity location (site) id the department belongs to
        isActive:
          type: boolean
        parentId:
          type: object
          description: Optional parent department id
    CreateWardDto:
      type: object
      properties:
        code:
          type: string
          description: Short unique code, e.g. W3A
        name:
          type: string
          description: Ward display name
        wardType:
          type: string
          enum: &ref_20
            - GENERAL
            - PRIVATE
            - ICU
            - PEDIATRIC
            - MATERNITY
            - ISOLATION
            - EMERGENCY
            - OTHER
          default: GENERAL
        departmentId:
          type: string
          description: Owning EMR department id
        departmentType:
          type: string
          description: Friendly department type label
        description:
          type: string
        isActive:
          type: boolean
          default: true
      required:
        - code
        - name
    UpdateWardDto:
      type: object
      properties:
        code:
          type: string
        name:
          type: string
        wardType:
          type: string
          enum: *ref_20
        departmentId:
          type: string
        departmentType:
          type: string
        description:
          type: string
        isActive:
          type: boolean
    CreateBedDto:
      type: object
      properties:
        code:
          type: string
          description: Short bed code, e.g. B-101
        wardId:
          type: string
          description: Ward the bed belongs to
        bedType:
          type: string
          enum: &ref_21
            - STANDARD
            - ICU
            - MATERNITY
            - ISOLATION
            - PEDIATRIC
            - RECOVERY
          default: STANDARD
        status:
          type: string
          enum: &ref_22
            - AVAILABLE
            - OCCUPIED
            - MAINTENANCE
            - OUT_OF_SERVICE
          default: AVAILABLE
        notes:
          type: string
      required:
        - code
        - wardId
    UpdateBedDto:
      type: object
      properties:
        code:
          type: string
        wardId:
          type: string
        bedType:
          type: string
          enum: *ref_21
        status:
          type: string
          enum: *ref_22
        notes:
          type: string
    AdmitPatientDto:
      type: object
      properties:
        patientId:
          type: string
          description: Patient MRN
        patientName:
          type: string
          description: Patient display name
        wardId:
          type: string
        bedId:
          type: string
          description: Bed to allocate on admission
        admissionDatetime:
          type: string
          default: '2026-09-22T21:34:41.703Z'
        admissionType:
          type: string
          enum: &ref_23
            - EMERGENCY
            - URGENT
            - ELECTIVE
            - MATERNITY
            - SURGICAL
            - MEDICAL
          default: ELECTIVE
        diagnosis:
          type: string
        referringProviderId:
          type: string
        referringProviderName:
          type: string
        notes:
          type: string
        visitId:
          type: string
          description: >-
            Link the admission to an existing visit; a visit is auto-created
            when omitted
      required:
        - patientId
        - patientName
    AdmitFromVisitDto:
      type: object
      properties:
        wardId:
          type: string
          description: Ward to admit into
        bedId:
          type: string
          description: Bed to allocate on admission
        admissionType:
          type: string
          enum: *ref_23
          default: ELECTIVE
        diagnosis:
          type: string
        notes:
          type: string
    UpdateAdmissionDto:
      type: object
      properties:
        wardId:
          type: string
        bedId:
          type: string
        admissionDatetime:
          type: string
        admissionType:
          type: string
          enum: *ref_23
        diagnosis:
          type: string
        referringProviderId:
          type: string
        referringProviderName:
          type: string
        notes:
          type: string
    TransferAdmissionDto:
      type: object
      properties:
        wardId:
          type: string
          description: Destination ward
        bedId:
          type: string
          description: Destination bed
    DischargeDto:
      type: object
      properties:
        dischargeType:
          type: string
          enum:
            - DISCHARGED_HOME
            - DIED
            - REFERRED
            - TRANSFERRED
            - SELF_DISCHARGE
            - AMA
          default: DISCHARGED_HOME
        dischargeSummary:
          type: string
        dischargeDatetime:
          type: string
          default: '2026-09-22T21:34:41.704Z'
    CreateVisitDto:
      type: object
      properties:
        patientId:
          type: string
        patientName:
          type: string
        visitType:
